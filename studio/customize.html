<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* The editor needs the local server (it reads inside the template preview,
   which browsers block for file://). Bounce to the running server if opened
   from disk. No-op when already served over http. */
(function () {
  if (location.protocol === 'file:') {
    location.replace('http://localhost:4787/studio/customize.html' + location.hash);
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>FrontDoor | Customize a template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0B362A;--forest2:#072820;--green:#00A583;--green-dark:#00846a;
  --canvas:#F8F9FB;--panel:#fff;--line:#E5E2DC;--ink:#1B1812;--muted:#8A8480;
  --font-display:"Fraunces",Georgia,serif;--font-sans:"Inter",-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--canvas);height:100vh;overflow:hidden;font-size:15px}
.app{display:grid;grid-template-columns:400px 1fr;height:100vh}
/* ---- panel (form) ---- */
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh}
.panel__head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex:none}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:600}
.logo__mark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--font-sans);font-weight:700;font-size:13px}
.panel__head small{color:var(--muted);font-size:12px;display:block;margin-top:1px}
.panel__body{overflow-y:auto;padding:8px 22px 24px;flex:1}
.group{border-bottom:1px solid var(--line);padding:16px 0}
.group>summary{font-family:var(--font-display);font-size:16px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.group>summary::-webkit-details-marker{display:none}
.group>summary::after{content:"+";color:var(--muted);font-size:18px;font-family:var(--font-sans)}
.group[open]>summary::after{content:"–"}
.field{margin-top:12px}
.field .rngval{font-weight:700;color:var(--ink)}
.field input[type=range]{accent-color:var(--green,#00A583);margin-top:4px}
/* flashes the field that matches whatever was just clicked in the preview.
   A ring rather than a bar in the margin, which the panel's overflow clips. */
.field.d7-fieldhi{border-radius:8px;animation:d7FieldFlash 2.4s ease}
@keyframes d7FieldFlash{
  0%,55%{background:rgba(0,165,131,.14);box-shadow:0 0 0 2px rgba(0,165,131,.5)}
  100%{background:transparent;box-shadow:0 0 0 2px rgba(0,165,131,0)}
}
@media (prefers-reduced-motion:reduce){ .field.d7-fieldhi{animation:none;box-shadow:0 0 0 2px rgba(0,165,131,.5)} }
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.field input,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);color:var(--ink)}
.field textarea{resize:vertical;min-height:58px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field--color{display:flex;align-items:center;gap:12px}
.field--color input[type=color]{width:46px;height:38px;padding:2px;border-radius:8px;cursor:pointer}
.field--color input[type=text]{flex:1}
.imgrow{display:flex;gap:8px;align-items:center}
.imgrow input[type=text]{flex:1}
.upload{font-size:12px;font-weight:600;color:var(--green);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;white-space:nowrap}
.upload input{display:none}
.panel__foot{flex:none;padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:100px;font-size:14px;font-weight:600;border:1.5px solid var(--green);cursor:pointer;font-family:inherit}
.btn--primary{background:var(--green);color:#fff}.btn--primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--line);flex:none;padding:13px 16px}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
/* ---- saved projects bar ---- */
.projbar{flex:none;padding:12px 22px;border-top:1px solid var(--line);background:var(--canvas);display:grid;gap:8px}
.projbar__row{display:flex;gap:8px}
.projbar select,.projbar input{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.projbar select{flex:1}.projbar input{flex:1}
.projbar select:focus,.projbar input:focus{outline:none;border-color:var(--green)}
.pbtn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.pbtn:hover{border-color:var(--green);color:var(--green-dark)}
.pbtn--save{background:var(--green);color:#fff;border-color:var(--green)}.pbtn--save:hover{background:var(--green-dark);color:#fff}
.pbtn--file{display:inline-flex;align-items:center;cursor:pointer}.pbtn--file input{display:none}
/* ---- preview ---- */
.preview{position:relative;display:flex;flex-direction:column;background:#e9eaec}
/* four columns for four children: picker · device · icons · close. With only
   three the close button fell into an implicit fourth column and overflowed
   the bar, which is why it floated over the preview below. */
.preview__bar{flex:none;height:52px;display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;padding:0 14px 0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.preview__bar>.tpl{justify-self:start}
.preview__bar>.seg{justify-self:center}
.preview__bar>.close-x{justify-self:end}
.close-x{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:20px;line-height:1;cursor:pointer;flex:none;transition:.15s}
.close-x:hover{background:#F5F3EF;border-color:var(--muted);color:var(--ink)}
.tpl{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--canvas);border:1px solid var(--line);border-radius:100px;padding:8px 14px;cursor:pointer;max-width:230px}
.preview__bar>.tpl-group{justify-self:start;display:inline-flex;align-items:center;gap:7px}
.pv-ico{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;flex:none;transition:.15s}
.pv-ico:hover:not(:disabled){background:var(--canvas)}
.pv-ico:disabled{opacity:.36;cursor:default}
.ghint{margin:2px 0 12px;font-size:12px;line-height:1.45;color:var(--muted)}
.tpl:focus{outline:none;border-color:var(--green)}
.seg{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:100px;padding:3px}
.seg button{border:0;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 16px;border-radius:100px;cursor:pointer}
.seg button.on{background:var(--forest);color:#fff}
.preview__stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:22px}
.frameWrap{background:#fff;box-shadow:0 20px 60px -30px rgba(0,0,0,.4);border-radius:10px;overflow:hidden;transition:width .3s ease;width:100%;max-width:1180px;height:100%}
.frameWrap.mobile{max-width:390px}
iframe{width:100%;height:100%;border:0;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:1fr}.preview{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="panel__head">
      <span class="logo"><span class="logo__mark">FD</span> Studio</span>
      <div><small>Click any text or image in the preview to edit it, or use the fields below.</small></div>
    </div>
    <div class="panel__body" id="form"></div>
    <div class="projbar">
      <div class="projbar__row">
        <select id="projList" title="Load a saved client project"><option value="">Saved projects…</option></select>
        <button class="pbtn" id="projDelete" title="Delete the selected project">Delete</button>
      </div>
      <div class="projbar__row">
        <input id="projName" type="text" placeholder="Client / project name" title="Name to save this project under">
        <button class="pbtn pbtn--save" id="projSave" title="Save the current form as a project">Save</button>
        <button class="pbtn" id="projExport" title="Export the selected (or current) project as a .json file">Export</button>
        <label class="pbtn pbtn--file" id="projImport" title="Import a project from a .json file">Import<input type="file" accept="application/json,.json"></label>
      </div>
    </div>
    <div class="panel__foot">
      <button class="btn btn--ghost" id="reset" title="Reset to defaults"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="btn btn--primary" id="download"><svg viewBox="0 0 24 24"><path d="M12 3v13M7 12l5 5 5-5M5 21h14"/></svg> Download website</button>
    </div>
  </aside>
  <main class="preview">
    <div class="preview__bar">
      <div class="tpl-group">
        <button id="undoBtn" class="pv-ico" type="button" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
        <button id="redoBtn" class="pv-ico" type="button" title="Redo (Ctrl+Shift+Z)" disabled>&#8631;</button>
        <select id="tpl" class="tpl" title="Choose a template">
          <option value="editable-practice.html">Starter, Practice (universal)</option>
          <!-- Catalog designs are injected here from ../js/catalog.js so this list
               always matches the current 30 designs shown on the public site. -->
        </select>
      </div>
      <div class="seg"><button data-w="desktop" class="on">Desktop</button><button data-w="mobile">Mobile</button></div>
      <!-- some clients want no decorative icons at all; this hides every one
           on the site in a single click, and the choice is kept on export -->
      <div class="seg" id="iconSeg" title="Show or hide the decorative icons across this site"><button data-ic="on" class="on">Icons on</button><button data-ic="off">Icons off</button></div>
      <a href="../index.html" id="closeStudio" class="close-x" title="Close Studio, back to homepage" aria-label="Close Studio">&times;</a>
    </div>
    <div class="preview__stage"><div class="frameWrap" id="frameWrap"><iframe id="frame" src="editable-practice.html"></iframe></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- Keep the template picker in sync with the public catalog (single source of truth) -->
<script src="../js/catalog.js?v=20261023a"></script>
<script>
(function () {
  var C = window.SW_CATALOG, sel = document.getElementById('tpl');
  if (!C || !sel || !C.categories || !C.categoryOf) return;
  function areaName(id) { for (var i = 0; i < C.areas.length; i++) if (C.areas[i].id === id) return C.areas[i].name; return ''; }
  var built = C.designs.filter(function (d) { return !d.soon; });
  // Group by the same 4 browse categories used on the public site's design section.
  C.categories.forEach(function (cat) {
    var ds = built.filter(function (d) { return C.categoryOf(d) === cat.id; });
    if (!ds.length) return;
    var og = document.createElement('optgroup');
    og.label = cat.name;
    ds.forEach(function (d) {
      var o = document.createElement('option');
      o.value = '../' + d.file;
      o.textContent = d.name + ', ' + areaName(d.area);
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
})();
</script>

<script>
// ---- field configuration (maps form -> template data-field / data-img / colour) ----
const GROUPS = [
  {title:"Business info", open:true, note:"Fill this once. The name, phone, email, address and hours update everywhere they appear on the site, including footer and contact links.", fields:[
    {id:"brandName", label:"Business name", type:"text"},
    {id:"phone", label:"Phone", type:"text", half:true},{id:"email", label:"Email", type:"text", half:true},
    {id:"address", label:"Address", type:"text"},
    {id:"hours", label:"Opening hours", type:"text"},
  ]},
  {title:"Brand & colour", open:true, fields:[
    {id:"navCta", label:"Button label (nav)", type:"text"},
    {id:"accent", label:"Brand colour", type:"color"},
    {id:"logoText", label:"Logo text (the logo only, not the business name)", type:"text"},
    {id:"logoImg", label:"Logo image (replaces the text)", type:"logo"},
    {id:"logoH", label:"Logo size", type:"range", min:14, max:90, def:36},
    {id:"hero", label:"Hero image", type:"image"},
    {id:"about", label:"About image", type:"image"},
  ]},
  {title:"Hero", fields:[
    {id:"heroEyebrow", label:"Eyebrow", type:"text"},
    {id:"heroTitle", label:"Headline", type:"textarea"},
    {id:"heroSub", label:"Sub-headline", type:"textarea"},
    {id:"heroCta1", label:"Primary button", type:"text", half:true},
    {id:"heroCta2", label:"Secondary button", type:"text", half:true},
    {id:"trustText", label:"Trust line", type:"text"},
  ]},
  {title:"Services", fields:[
    {id:"servicesTitle", label:"Section heading", type:"text"},
    {id:"servicesSub", label:"Section sub-line", type:"text"},
    {id:"svc1Title", label:"Service 1, title", type:"text"},{id:"svc1Desc", label:"Service 1, description", type:"textarea"},
    {id:"svc2Title", label:"Service 2, title", type:"text"},{id:"svc2Desc", label:"Service 2, description", type:"textarea"},
    {id:"svc3Title", label:"Service 3, title", type:"text"},{id:"svc3Desc", label:"Service 3, description", type:"textarea"},
    {id:"svc4Title", label:"Service 4, title", type:"text"},{id:"svc4Desc", label:"Service 4, description", type:"textarea"},
    {id:"svc5Title", label:"Service 5, title", type:"text"},{id:"svc5Desc", label:"Service 5, description", type:"textarea"},
    {id:"svc6Title", label:"Service 6, title", type:"text"},{id:"svc6Desc", label:"Service 6, description", type:"textarea"},
  ]},
  {title:"About", fields:[
    {id:"aboutTitle", label:"Heading", type:"text"},
    {id:"aboutText", label:"Paragraph", type:"textarea"},
    {id:"check1", label:"Point 1", type:"text"},{id:"check2", label:"Point 2", type:"text"},
    {id:"check3", label:"Point 3", type:"text"},{id:"check4", label:"Point 4", type:"text"},
  ]},
  {title:"Stats", fields:[
    {id:"stat1Num", label:"Stat 1, number", type:"text", half:true},{id:"stat1Label", label:"Stat 1, label", type:"text", half:true},
    {id:"stat2Num", label:"Stat 2, number", type:"text", half:true},{id:"stat2Label", label:"Stat 2, label", type:"text", half:true},
    {id:"stat3Num", label:"Stat 3, number", type:"text", half:true},{id:"stat3Label", label:"Stat 3, label", type:"text", half:true},
  ]},
  {title:"Testimonial", fields:[
    {id:"quoteText", label:"Quote", type:"textarea"},
    {id:"quoteAuthor", label:"Author", type:"text", half:true},{id:"quoteRole", label:"Role / location", type:"text", half:true},
  ]},
  {title:"Contact section", fields:[
    {id:"contactTitle", label:"Heading", type:"text"},
    {id:"contactSub", label:"Sub-line", type:"text"},
  ]},
  {title:"Footer", fields:[
    {id:"footerText", label:"Closing line", type:"text"},
    {id:"footerLegal", label:"Legal / copyright", type:"text"},
  ]},
];

const frame = document.getElementById('frame');
const form = document.getElementById('form');
let doc = null; // iframe document

// darken a hex colour ~20% for hover/dark accent
function darken(hex){
  const m = hex.replace('#',''); if(m.length!==6) return hex;
  const n = p=>Math.max(0,Math.round(parseInt(m.substr(p,2),16)*0.8)).toString(16).padStart(2,'0');
  return '#'+n(0)+n(2)+n(4);
}
function setField(id,val){ if(!doc)return;
  // a logo carrying its own typed word is left alone; the name still drives everything else
  doc.querySelectorAll('[data-field="'+id+'"]').forEach(el=>{ if(!el.hasAttribute('data-d7logotext')) el.textContent=val; });
  // business-info fields also drive the clickable links, not just the visible text
  if(id==='phone'){ const t='tel:'+String(val).replace(/[^\d+]/g,''); doc.querySelectorAll('a[href^="tel:"]').forEach(a=>a.setAttribute('href',t)); }
  else if(id==='email'){ const e=String(val).trim(); doc.querySelectorAll('a[href^="mailto:"]').forEach(a=>a.setAttribute('href','mailto:'+e)); }
}
/* ---- Logo: swap the wordmark for a client's own image -----------------
   Templates draw the logo as a letter badge plus the business name. When a
   logo image is given, both are hidden and the picture takes their place in
   the same link, header and footer alike. Clearing the field puts the
   wordmark back. ---------------------------------------------------------- */
function applyLogo(){
  if(!doc) return;
  const uIn=document.getElementById('f_logoImg'), hIn=document.getElementById('f_logoH'),
        tIn=document.getElementById('f_logoText');
  if(!uIn) return;
  const url=(uIn.value||'').trim(), size=(hIn&&hIn.value)||36,
        text=(tIn&&tIn.value||'').trim();
  doc.querySelectorAll('[data-field="brandMark"]').forEach(mark=>{
    const link=mark.closest('a')||mark.parentElement; if(!link) return;
    link.setAttribute('data-d7logo','1');               // so it can be moved as one piece
    const name=link.querySelector('[data-field="brandName"]');
    let img=link.querySelector('img.d7-logoimg');
    if(url){                                             // an image wins over typed text
      if(!img){ img=doc.createElement('img'); img.className='d7-logoimg'; img.alt=''; link.insertBefore(img, link.firstChild); }
      if(img.getAttribute('src')!==url) img.setAttribute('src',url);
      img.style.height=size+'px';
      mark.setAttribute('data-d7logohide','1');
      if(name){ name.setAttribute('data-d7logohide','1'); name.style.fontSize=''; }
      return;
    }
    if(img) img.remove();
    mark.removeAttribute('data-d7logohide');
    if(!name){ return; }
    name.removeAttribute('data-d7logohide');
    if(text){
      // Marked so the Business name field leaves it alone: this word belongs to
      // the logo, and the business name still drives the footer, title and links.
      name.setAttribute('data-d7logotext','1');
      if(name.textContent!==text) name.textContent=text;
      name.style.fontSize=size+'px';
    } else {
      name.removeAttribute('data-d7logotext');
      name.style.fontSize='';
      const bn=document.getElementById('f_brandName');
      if(bn && bn.value && name.textContent!==bn.value) name.textContent=bn.value;
    }
  });
}
function setImg(id,src){ if(!doc)return; const el=doc.querySelector('[data-img="'+id+'"]'); if(el)el.src=src; }
function setAccent(hex){ if(!doc)return; const d=darken(hex);
  let st=doc.getElementById('d7-accent'); if(!st){st=doc.createElement('style');st.id='d7-accent';doc.head.appendChild(st);}
  // '*' + !important overrides the template's own scoped --acc/--accent definitions wherever they sit
  st.textContent='*{--acc:'+hex+'!important;--accent:'+hex+'!important;--acc2:'+d+'!important;--accent-dark:'+d+'!important}';
}
// Studio-only: reveal-on-scroll elements shown immediately while editing (removed on export)
function ensurePreviewStyle(){ if(!doc)return; if(doc.getElementById('d7-studio-only'))return; const s=doc.createElement('style');s.id='d7-studio-only';s.textContent='.reveal{opacity:1!important;transform:none!important}';doc.head.appendChild(s); }
function updateMark(name){ if(!doc)return; const ltr=(name.trim()[0]||'Y').toUpperCase(); doc.querySelectorAll('[data-field="brandMark"]').forEach(el=>el.textContent=ltr); }
function toggleCard(n){ if(!doc)return; const t=(document.getElementById('f_svc'+n+'Title').value||'').trim(); const card=doc.querySelector('[data-card="'+n+'"]'); if(card)card.dataset.empty=t?'0':'1'; }
function toggleCheck(n){ if(!doc)return; const v=(document.getElementById('f_check'+n).value||'').trim(); const li=doc.querySelector('[data-check="'+n+'"]'); if(li)li.dataset.empty=v?'0':'1'; }

// build the form
GROUPS.forEach((g,gi)=>{
  const d=document.createElement('details'); d.className='group'; if(g.open)d.open=true;
  d.innerHTML='<summary>'+g.title+'</summary>'+(g.note?'<p class="ghint">'+g.note+'</p>':'');
  let holder=d;
  for(let i=0;i<g.fields.length;i++){
    const f=g.fields[i];
    const wrap=document.createElement('div'); wrap.className='field'+(f.type==='color'?' field--color':'');
    if(f.type==='logo'){
      wrap.innerHTML='<label>'+f.label+'</label><div class="imgrow"><input type="text" id="f_'+f.id+'" placeholder="Logo URL, or upload"><label class="upload">Upload<input type="file" accept="image/*" data-logo="'+f.id+'"></label></div>';
    } else if(f.type==='range'){
      wrap.innerHTML='<label>'+f.label+' <b class="rngval" id="v_'+f.id+'">'+f.def+'</b>px</label>'
        +'<input type="range" id="f_'+f.id+'" min="'+f.min+'" max="'+f.max+'" step="1" value="'+f.def+'" style="width:100%">';
    } else if(f.type==='image'){
      wrap.innerHTML='<label>'+f.label+'</label><div class="imgrow"><input type="text" id="f_'+f.id+'" placeholder="Image URL"><label class="upload">Upload<input type="file" accept="image/*" data-img="'+f.id+'"></label></div>';
    } else if(f.type==='color'){
      wrap.innerHTML='<label style="width:100%">'+f.label+'</label><input type="color" id="c_'+f.id+'" value="#2E8B8B"><input type="text" id="f_'+f.id+'" value="#2E8B8B">';
    } else if(f.type==='textarea'){
      wrap.innerHTML='<label>'+f.label+'</label><textarea id="f_'+f.id+'"></textarea>';
    } else {
      wrap.innerHTML='<label>'+f.label+'</label><input type="text" id="f_'+f.id+'">';
    }
    // pack half-width pairs into a row
    if(f.half && g.fields[i+1] && g.fields[i+1].half){
      const row=document.createElement('div'); row.className='row2'; row.appendChild(wrap);
      const f2=g.fields[++i]; const w2=document.createElement('div'); w2.className='field';
      w2.innerHTML='<label>'+f2.label+'</label>'+(f2.type==='textarea'?'<textarea id="f_'+f2.id+'"></textarea>':'<input type="text" id="f_'+f2.id+'">');
      row.appendChild(w2); holder.appendChild(row);
    } else holder.appendChild(wrap);
  }
  form.appendChild(d);
});

// attach input listeners ONCE (they read the live `doc`, which is refreshed on each iframe load)
function attach(){
  GROUPS.forEach(g=>g.fields.forEach(f=>{
    const inp=document.getElementById('f_'+f.id); if(!inp)return;
    if(f.type==='logo'){
      inp.addEventListener('input',applyLogo);
      const lf=document.querySelector('input[type=file][data-logo="'+f.id+'"]');
      if(lf)lf.addEventListener('change',()=>{const fl=lf.files[0];if(!fl)return;const rd=new FileReader();rd.onload=e=>{inp.value=e.target.result;applyLogo();};rd.readAsDataURL(fl);});
    } else if(f.type==='range'){
      inp.addEventListener('input',()=>{ const o=document.getElementById('v_'+f.id); if(o)o.textContent=inp.value; applyLogo(); });
    } else if(f.type==='image'){
      inp.addEventListener('input',()=>setImg(f.id,inp.value));
      const file=document.querySelector('input[type=file][data-img="'+f.id+'"]');
      if(file)file.addEventListener('change',()=>{const fr=file.files[0];if(!fr)return;const rd=new FileReader();rd.onload=e=>{inp.value=e.target.result;setImg(f.id,e.target.result);};rd.readAsDataURL(fr);});
    } else if(f.type==='color'){
      inp.addEventListener('input',()=>{setAccent(inp.value);if(/^#[0-9a-fA-F]{6}$/.test(inp.value))document.getElementById('c_'+f.id).value=inp.value;});
      document.getElementById('c_'+f.id).addEventListener('input',e=>{inp.value=e.target.value;setAccent(e.target.value);});
    } else {
      inp.addEventListener('input',()=>{
        setField(f.id,inp.value);
        if(f.id==='logoText'){ applyLogo(); return; }        // logo-only word
        if(f.id==='brandName'){ updateMark(inp.value); applyLogo(); }
        const sm=f.id.match(/^svc(\d)Title$/); if(sm)toggleCard(sm[1]);
        const cm=f.id.match(/^check(\d)$/); if(cm)toggleCheck(cm[1]);
      });
    }
  }));
}
// on each (re)load: point `doc` at the new template and pull its defaults into the form
function populate(){
  doc = frame.contentDocument; if(!doc)return;
  ensurePreviewStyle();
  doc.querySelectorAll('.reveal').forEach(e=>e.classList.add('is-in')); // show all sections while editing
  initInlineEditor(); // enable click-to-edit on the live preview
  d7ResetHistory(); // fresh undo history per loaded template
  GROUPS.forEach(g=>g.fields.forEach(f=>{
    const inp=document.getElementById('f_'+f.id); if(!inp)return;
    if(f.type==='logo'||f.type==='range'||f.id==='logoText'){
      inp.disabled=false; return;   // held in the form, re-applied below
    } else if(f.type==='image'){
      const el=doc.querySelector('[data-img="'+f.id+'"]');
      inp.value=el?(el.getAttribute('src')||''):''; inp.disabled=!el;
    } else if(f.type==='color'){
      const rs=getComputedStyle(doc.documentElement);
      let cur=(rs.getPropertyValue('--acc')||rs.getPropertyValue('--accent')||'#2E8B8B').trim(); if(!/^#/.test(cur))cur='#2E8B8B';
      inp.value=cur; if(/^#[0-9a-fA-F]{6}$/.test(cur))document.getElementById('c_'+f.id).value=cur;
    } else {
      const el=doc.querySelector('[data-field="'+f.id+'"]');
      if(el){inp.value=el.textContent.trim(); inp.disabled=false;} else {inp.value=''; inp.disabled=true;}
    }
  }));
  for(let n=1;n<=6;n++)toggleCard(n); for(let n=1;n<=4;n++)toggleCheck(n);
  applyLogo(); // a chosen logo survives switching template
}
attach();

// download finished site
async function inlineAsset(clone,selector,make){
  const el=clone.querySelector(selector); if(!el)return;
  try{ const txt=await (await fetch(el.href||el.src)).text(); el.replaceWith(make(txt)); }catch(e){/* leave external ref if fetch fails */}
}
document.getElementById('download').addEventListener('click',async ()=>{
  if(!doc)return;
  const clone=doc.documentElement.cloneNode(true);
  clone.querySelectorAll('[data-empty="1"]').forEach(el=>el.remove());
  const so=clone.querySelector('#d7-studio-only'); if(so)so.remove(); // keep scroll animations in the delivered file
  clone.querySelectorAll('.reveal.is-in').forEach(e=>e.classList.remove('is-in')); // restore reveal-on-scroll for visitors
  // strip inline-editor artefacts (KEEP the user's image size/position inline styles)
  clone.querySelectorAll('#d7-editor-style,#d7-imgbox,#d7-imgbar,#d7-ctx,#d7-txtbar,#d7-actbar,#d7-guides,#d7-iconbar').forEach(el=>el.remove());
  clone.querySelectorAll('.d7-ihi').forEach(el=>el.classList.remove('d7-ihi'));
  // A frame the user only ever clicked carries the PREVIEW's pixel width. Shipping
  // that pins a responsive image to the width of the Studio pane, so a full-bleed
  // hero stops filling a wider screen. Undo those frames entirely; the ones the
  // user actually sized, moved, zoomed, cropped or brightened keep their numbers.
  clone.querySelectorAll('.d7-frame[data-d7auto]').forEach(fr=>{
    const im=fr.querySelector('img');
    const touched = fr.hasAttribute('data-d7float') ||
      (im && (im.dataset.d7z||im.dataset.d7b||im.dataset.d7px||im.dataset.d7py));
    if(touched) return;
    if(fr.hasAttribute('data-d7adopt')){        // the template's own element: put it back as it was
      fr.setAttribute('style', fr.dataset.d7frstyle||'');
      if(!fr.getAttribute('style')) fr.removeAttribute('style');
      if(im){ im.setAttribute('style', fr.dataset.d7imgstyle||'');
              if(!im.getAttribute('style')) im.removeAttribute('style'); }
      fr.classList.remove('d7-frame');
      return;
    }
    if(!im) return;                              // a wrapper we added: take it back out
    im.setAttribute('style', fr.dataset.d7imgstyle||'');
    if(!im.getAttribute('style')) im.removeAttribute('style');
    fr.parentNode.insertBefore(im, fr); fr.remove();
  });
  clone.querySelectorAll('[data-d7del]').forEach(el=>el.remove()); // actually remove deleted elements from the delivered file
  clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  clone.querySelectorAll('.d7-hi').forEach(el=>el.classList.remove('d7-hi'));
  // persist "remove decoration": the editor CSS is stripped, so bake a rule for [data-d7nodeco] (and keep the attribute)
  if(clone.querySelector('.d7-logoimg')){ const lg=doc.createElement('style');
    lg.textContent='[data-d7logohide]{display:none!important}img.d7-logoimg{display:inline-block;width:auto;max-width:none;object-fit:contain;vertical-align:middle}';
    (clone.querySelector('head')||clone).appendChild(lg); }
  if(clone.querySelector('[data-d7nodeco]')){ const nd=doc.createElement('style'); nd.textContent='[data-d7nodeco]::before,[data-d7nodeco]::after{content:none!important;display:none!important}'; (clone.querySelector('head')||clone).appendChild(nd); }
  // same for the icon choices: bake the rules, keep the attributes that drive them
  if(clone.getAttribute('data-d7icons')==='off' || clone.querySelector('[data-d7iconoff]')){
    const ic=doc.createElement('style');
    ic.textContent='[data-d7icons="off"] [data-d7icon]{display:none!important}'
      +'[data-d7icons="off"] [data-d7icondeco]::before,[data-d7icons="off"] [data-d7icondeco]::after{content:none!important;display:none!important}'
      +'[data-d7iconoff]{display:none!important}';
    (clone.querySelector('head')||clone).appendChild(ic);
  } else { // icons all left as they are: drop the marker attributes entirely
    ['data-d7icon','data-d7icondeco'].forEach(a=>clone.querySelectorAll('['+a+']').forEach(el=>el.removeAttribute(a)));
  }
  ['data-d7z','data-d7b','data-d7px','data-d7py','data-d7zi','data-d7float','data-d7ow','data-d7oh','data-d7ov','data-d7fr','data-d7adopt','data-d7icon0','data-d7logo','data-d7logotext','data-d7auto','data-d7imgstyle','data-d7frstyle','data-d7pre'].forEach(a=>clone.querySelectorAll('['+a+']').forEach(el=>el.removeAttribute(a)));
  // .d7-frame wrappers + .d7-ph placeholders are KEPT (they hold the crop/size/placement and keep the layout stable)
  // make the file self-contained: inline the shared template.css + template.js (bespoke templates use them)
  await inlineAsset(clone,'link[rel="stylesheet"][href*="template.css"]',css=>{const s=doc.createElement('style');s.textContent=css;return s;});
  await inlineAsset(clone,'script[src*="template.js"]',js=>{const s=doc.createElement('script');s.textContent=js;return s;});
  const html='<!DOCTYPE html>\n'+clone.outerHTML;
  const name=((document.getElementById('f_brandName').value||'website').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'website';
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.html';a.click();
  URL.revokeObjectURL(a.href);
  toast('Downloaded '+name+'.html, self-contained & ready to deploy');
});

function d7StartPan(e){ e.preventDefault(); e.stopPropagation();

  let [px,py]=d7ReadPos(img); const sx=e.clientX, sy=e.clientY; d7drag={};
  const mv=ev=>{ // drag the photo one way → reveal the opposite side, so object-position moves against the drag
    let nx=Math.max(0,Math.min(100, px-(ev.clientX-sx)/r.width*100));
    let ny=Math.max(0,Math.min(100, py-(ev.clientY-sy)/r.height*100));
    img.dataset.d7px=nx; img.dataset.d7py=ny; img.style.objectPosition=nx+'% '+ny+'%'; };
  const up=()=>{ doc.removeEventListener('mousemove',mv); doc.removeEventListener('mouseup',up); d7drag=null; };
  doc.addEventListener('mousemove',mv); doc.addEventListener('mouseup',up);
}
// Take the frame OUT OF FLOW (absolute) so resizing/moving it never pushes the surrounding text.
// A hidden placeholder holds the original slot, so nothing else on the page shifts.
function d7Float(fr){
  if(fr.dataset.d7float) return;
  const win=doc.defaultView, r=fr.getBoundingClientRect(), cs=win.getComputedStyle(fr);
  // The placeholder holds the slot the element is about to vacate, so the page
  // does not reflow around it. An element that was already out of flow had no
  // slot to hold: adding one INVENTS space. In a flex parent that placeholder
  // becomes an item and shoves the real content sideways, which is what pushed
  // a hero's heading into the middle when its background image was grabbed.
  if(cs.position!=='absolute' && cs.position!=='fixed'){
    const ph=doc.createElement('span'); ph.className='d7-ph';
    // Carry the element's placement, not just its size. A grid item placed by
    // grid-area leaves a hole the placeholder must fill; without it the bare
    // span is auto-placed into a NEW implicit row and the grid grows by a
    // whole row, which pushed a hero's heading hundreds of px down the page.
    ph.style.cssText='display:'+cs.display+';width:'+r.width+'px;height:'+r.height+'px;margin:'+cs.marginTop+' '+cs.marginRight+' '+cs.marginBottom+' '+cs.marginLeft+';vertical-align:'+cs.verticalAlign+';flex:'+(cs.flex||'0 0 auto')+';grid-area:'+(cs.gridArea||'auto')+';align-self:'+(cs.alignSelf||'auto')+';justify-self:'+(cs.justifySelf||'auto')+';order:'+(cs.order||'0')+';visibility:hidden;pointer-events:none';
    fr.parentNode.insertBefore(ph, fr);
  }
  // Only a frame WE inserted leaves a styled slot behind worth hiding. An
  // adopted wrapper IS the styled thing, so blanking its parent would strip
  // the design the image is meant to keep.
  d7Unclip(fr); if(fr.classList&&fr.classList.contains('d7-frame')&&!fr.dataset.d7adopt) d7Neutralize(fr);
  // remember the inline values we are about to overwrite, so unfloating can put
  // them back. A frame created around an absolutely positioned image carries
  // position:absolute of its own; blanking that on mouseup dropped it into flow
  // and shoved the hero copy sideways.
  fr.dataset.d7pre=JSON.stringify({position:fr.style.position,left:fr.style.left,top:fr.style.top,
    margin:fr.style.margin,zIndex:fr.style.zIndex});
  fr.style.position='absolute'; fr.style.margin='0'; fr.style.width=r.width+'px'; fr.style.height=r.height+'px';
  // carry the element's own stacking across, so going absolute does not quietly
  // reorder it against the content around it
  if(cs.zIndex && cs.zIndex!=='auto') fr.style.zIndex=cs.zIndex;
  const op=fr.offsetParent||doc.body, opr=op.getBoundingClientRect();
  fr.style.left=(r.left-opr.left+(op.scrollLeft||0))+'px';
  fr.style.top=(r.top-opr.top+(op.scrollTop||0))+'px';
  fr.dataset.d7float='1';
}
function d7Unfloat(fr){
  let sib=fr.previousElementSibling; while(sib && !(sib.classList&&sib.classList.contains('d7-ph'))) sib=sib.previousElementSibling;
  if(sib) sib.remove();
  d7Reclip(fr); d7RestoreSlot(fr);
  let pre={position:'',left:'',top:'',margin:'',zIndex:''};
  try{ if(fr.dataset.d7pre) pre=JSON.parse(fr.dataset.d7pre); }catch(e){}
  fr.style.position=pre.position||''; fr.style.left=pre.left||''; fr.style.top=pre.top||'';
  fr.style.margin=pre.margin||''; fr.style.zIndex=pre.zIndex||'';
  delete fr.dataset.d7pre; delete fr.dataset.d7float; delete fr.dataset.d7zi;
}
function d7StartMove(e){ d7HistPush(); // snapshot before a move or (in reframe mode) a crop pan
  if(d7Reframe && d7Sel){ return d7StartPan(e); } // in reframe mode, dragging pans the crop instead of moving the frame
  e.preventDefault(); e.stopPropagation();
  // No automatic z-index here. Raising the box to 100 on mousedown lifted a
  // full-bleed background image above the copy layered over it, so merely
  // clicking a hero image made its heading vanish. Layer order is the
  // editor's to change only when Bring forward / Send back is used.
  const fr=d7CurBox(); if(!fr)return;
  const wasFloated=!!fr.dataset.d7float; let movedAny=false; // a click that never drags changes nothing
  d7Float(fr);
  const L0=parseFloat(fr.style.left)||0, T0=parseFloat(fr.style.top)||0, sx=e.clientX, sy=e.clientY; d7drag={};
  const r0=fr.getBoundingClientRect(), W=r0.width, H=r0.height, T=d7CollectTargets(fr); // targets fixed at drag start
  const PEERS=d7CollectPeers(fr); // boxes of the same size, for equal-gap snapping
  const mv=ev=>{ movedAny=true; let L=L0+(ev.clientX-sx), Tp=T0+(ev.clientY-sy);
    const vx=r0.left+(L-L0), vy=r0.top+(Tp-T0); // predicted viewport position
    const sX=d7Nearest([vx,vx+W/2,vx+W], T.xs), sY=d7Nearest([vy,vy+H/2,vy+H], T.ys);
    if(sX){ L+=sX.snap; } if(sY){ Tp+=sY.snap; }
    // Centre the box between its two neighbours when the gaps either side are
    // already nearly equal. The snap only applies where an edge guide has not
    // claimed the axis, but the gaps are measured either way: an edge guide can
    // land on equal spacing by itself and that still deserves the indicator.
    const probe=()=>({left:r0.left+(L-L0), right:r0.left+(L-L0)+W, top:r0.top+(Tp-T0), bottom:r0.top+(Tp-T0)+H, width:W, height:H});
    let eqX=d7RowSpacing(PEERS, probe(), 'x'); if(eqX && !sX) L+=eqX.shift;
    let eqY=d7RowSpacing(PEERS, probe(), 'y'); if(eqY && !sY) Tp+=eqY.shift;
    if(eqX) eqX=d7RowSpacing(PEERS, probe(), 'x');   // re-measure after the shift
    if(eqY) eqY=d7RowSpacing(PEERS, probe(), 'y');
    fr.style.left=L+'px'; fr.style.top=Tp+'px'; d7PositionBox();
    d7ClearGuides(); if(sX) d7Guide(true,sX.guide); if(sY) d7Guide(false,sY.guide);
    const now={left:r0.left+(L-L0), right:r0.left+(L-L0)+W, top:r0.top+(Tp-T0), bottom:r0.top+(Tp-T0)+H, width:W, height:H};
    if(eqX) d7EqBars(now, eqX, 'x');
    if(eqY) d7EqBars(now, eqY, 'y'); };
  const up=()=>{ doc.removeEventListener('mousemove',mv); doc.removeEventListener('mouseup',up); d7ClearGuides(); d7drag=null;
    if(!movedAny && !wasFloated){ d7Unfloat(fr); d7PositionBox(); } };
  doc.addEventListener('mousemove',mv); doc.addEventListener('mouseup',up);
}
function d7StartResize(e,h){ d7HistPush(); e.preventDefault(); e.stopPropagation();
  const fr=d7CurBox(); if(!fr)return;
  const wasFloatedR=!!fr.dataset.d7float, autoBefore=fr.dataset.d7auto; let sizedAny=false;
  d7Float(fr); // resize the floated box → never reflows the surrounding content
  const c=h.className, L0=parseFloat(fr.style.left)||0, T0=parseFloat(fr.style.top)||0, r=fr.getBoundingClientRect(), W0=r.width, H0=r.height, sx=e.clientX, sy=e.clientY; d7drag={};
  const offX=r.left-L0, offY=r.top-T0, TG=d7CollectTargets(fr); // viewport<->style offset + snap targets
  const SZ=d7CollectSizes(fr), R0=L0+W0, B0=T0+H0; // other images' sizes + the edges that stay put
  const mv=ev=>{ sizedAny=true; delete fr.dataset.d7auto; let dw=ev.clientX-sx, dh=ev.clientY-sy, L=L0,T=T0,W=W0,H=H0;
    if(c.indexOf('br')>-1){ W=W0+dw; H=H0+dh; }
    else if(c.indexOf('bl')>-1){ W=W0-dw; H=H0+dh; L=L0+dw; }
    else if(c.indexOf('tr')>-1){ W=W0+dw; H=H0-dh; T=T0+dh; }
    else { W=W0-dw; H=H0-dh; L=L0+dw; T=T0+dh; }
    // snap the edges being dragged to nearby targets, keeping the opposite edge fixed
    let gx=null, gy=null;
    if(c.indexOf('l')>-1){ const s=d7Nearest([L+offX],TG.xs); if(s){ const right=L+W; L=s.guide-offX; W=right-L; gx=s.guide; } }
    else if(c.indexOf('r')>-1){ const s=d7Nearest([L+W+offX],TG.xs); if(s){ W=(s.guide-offX)-L; gx=s.guide; } }
    if(c.indexOf('t')>-1){ const s=d7Nearest([T+offY],TG.ys); if(s){ const bot=T+H; T=s.guide-offY; H=bot-T; gy=s.guide; } }
    else if(c.indexOf('b')>-1){ const s=d7Nearest([T+H+offY],TG.ys); if(s){ H=(s.guide-offY)-T; gy=s.guide; } }
    if(W<40){ if(c.indexOf('l')>-1) L=L0+(W0-40); W=40; gx=null; }
    if(H<40){ if(c.indexOf('t')>-1) T=T0+(H0-40); H=40; gy=null; }
    // Lock to another image's exact measurement, so two can be matched without
    // eyeballing it. Only where an edge guide has not already claimed the axis,
    // and keeping whichever edge is not being dragged where it is.
    if(gx==null){ const s=d7NearestSize(W,SZ.ws); if(s!=null){ W=s; if(c.indexOf('l')>-1) L=R0-W; } }
    if(gy==null){ const s=d7NearestSize(H,SZ.hs); if(s!=null){ H=s; if(c.indexOf('t')>-1) T=B0-H; } }
    // Flag the match from the final figure, not from whether we snapped: an
    // edge guide can land it on the same size on its own, and the readout
    // should confirm that too.
    const mw=SZ.ws.indexOf(Math.round(W))>-1, mh=SZ.hs.indexOf(Math.round(H))>-1;
    fr.style.left=L+'px'; fr.style.top=T+'px'; fr.style.width=W+'px'; fr.style.height=H+'px'; d7PositionBox();
    d7ClearGuides(); if(gx!=null) d7Guide(true,gx); if(gy!=null) d7Guide(false,gy);
    d7Dims(L+offX, T+offY, W, H, mw, mh); };
  const up=()=>{ doc.removeEventListener('mousemove',mv); doc.removeEventListener('mouseup',up); d7ClearGuides(); d7drag=null;
    if(!sizedAny){ if(autoBefore) fr.dataset.d7auto=autoBefore; if(!wasFloatedR){ d7Unfloat(fr); d7PositionBox(); } } };
  doc.addEventListener('mousemove',mv); doc.addEventListener('mouseup',up);
}
function d7MenuAction(a){
  // snapshot for mutating actions (delete/edittext push their own snapshot; movebox only enters a mode)
  if(a==='nodeco'||a==='centerh'||a==='centerv'||a==='front'||a==='back') d7HistPush();
  // generic element actions (work on any element, not just images)
  if(a==='edittext'){ const tt=d7TextTarget(d7CtxEl); if(tt){ d7Deselect(); d7MakeEditable(tt); } return; }
  if(a==='nodeco'){ if(d7CtxEl) d7CtxEl.setAttribute('data-d7nodeco','1'); return; }
  if(a==='movebox'){ if(d7CtxEl) d7SelectBox(d7CtxEl); return; }
  if(a==='centerh'||a==='centerv'){ const box=d7CurBox()||d7CtxEl; if(box) d7Center(box, a==='centerh'?'h':'v'); return; }
  if(a==='delete'){ d7DeleteEl(d7CtxEl||d7CurBox()); return; }
  if(a==='front'||a==='back'){ const box=d7CurBox()||d7CtxEl; if(!box)return; d7Float(box); d7SetZ(box, a==='front'?(++d7zTop):-1); d7PositionBox(); return; }
  // image-only actions
  if(!d7Sel)return; const fr=d7Frame(d7Sel); if(!fr)return;
  if(a==='replace'){ d7ImgAction('replace'); }
  else if(a==='reset'){ d7ImgAction('reset'); }
  else if(a==='remove'){ d7HistPush(); fr.setAttribute('data-d7del','1'); fr.style.display='none'; d7DelStack.push(fr); toast('Deleted, Ctrl+Z to undo'); d7Deselect(); return; }
  d7PositionBox();
}
function d7ImgAction(a){ if(!d7Sel)return; const fr=d7Frame(d7Sel);
  if(a==='done'){ d7Deselect(); return; }
  if(a==='reframe'){ d7SetReframe(!d7Reframe); if(d7Reframe) toast('Reframe on, drag the photo to show a different part'); return; }
  if(a==='reset'){ d7HistPush();
    if(fr){ d7Unfloat(fr); fr.style.display='';
      // an adopted wrapper gets its size cleared, not pinned, so the template's
      // own aspect-ratio and width rules take back over
      if(fr.dataset.d7adopt){ fr.style.width=''; fr.style.height=''; fr.style.maxWidth=''; }
      else { fr.style.width=(fr.dataset.d7ow||'')+'px'; fr.style.height=(fr.dataset.d7oh||'')+'px'; } }
    d7Sel.style.transform=''; d7Sel.style.filter=''; d7Sel.style.objectPosition=''; delete d7Sel.dataset.d7z; delete d7Sel.dataset.d7b; delete d7Sel.dataset.d7px; delete d7Sel.dataset.d7py; d7SetReframe(false);
    const bar=doc.getElementById('d7-imgbar'), zr=bar.querySelector('.d7-zoomrange'), br=bar.querySelector('.d7-bright'); if(zr)zr.value=1; if(br)br.value=1; d7PositionBox(); return; }
  if(a==='replace'){ d7HistPush(); const inp=doc.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=ev=>{ d7Sel.src=ev.target.result; const id=d7Sel.getAttribute('data-img'); if(id){ const fi=document.getElementById('f_'+id); if(fi) fi.value=ev.target.result; } d7PositionBox(); }; rd.readAsDataURL(f); };
    inp.click(); }
}

// ============ Saved projects (localStorage + JSON export/import) ============
// Stays fully static: projects live in the browser, portable via .json files.
const STORE_KEY='d7_projects';
let pendingValues=null; // applied to the form after the next template load
function readStore(){ try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){return {};} }
function writeStore(o){ localStorage.setItem(STORE_KEY,JSON.stringify(o)); }
function collectState(){
  const values={};
  GROUPS.forEach(g=>g.fields.forEach(f=>{ const inp=document.getElementById('f_'+f.id); if(inp) values[f.id]=inp.value; }));
  return { template: document.getElementById('tpl').value, values };
}
function applyValues(values){
  GROUPS.forEach(g=>g.fields.forEach(f=>{
    if(!(f.id in values)) return;
    const inp=document.getElementById('f_'+f.id); if(!inp) return;
    inp.value=values[f.id];
    inp.dispatchEvent(new Event('input')); // reuse the live-update wiring
  }));
}
// runs AFTER populate() (registered earlier), so saved values overwrite template defaults
frame.addEventListener('load',()=>{ if(pendingValues){ applyValues(pendingValues); pendingValues=null; } });
function loadProject(state){
  if(!state) return;
  const tpl=document.getElementById('tpl');
  if(state.template) tpl.value=state.template;
  pendingValues=state.values||{};
  frame.src=(state.template||tpl.value)+'?t='+Date.now();
}
function refreshProjectList(sel){
  const list=document.getElementById('projList');
  const store=readStore();
  list.innerHTML='<option value="">Saved projects…</option>';
  Object.keys(store).sort().forEach(name=>{
    const o=document.createElement('option'); o.value=name; o.textContent=name;
    if(name===sel) o.selected=true;
    list.appendChild(o);
  });
}
document.getElementById('projSave').addEventListener('click',()=>{
  const nameInput=document.getElementById('projName');
  const listed=document.getElementById('projList').value;
  const name=(nameInput.value.trim()||listed||document.getElementById('f_brandName').value.trim());
  if(!name){ toast('Enter a project name first'); nameInput.focus(); return; }
  const store=readStore(); store[name]=collectState(); writeStore(store);
  refreshProjectList(name); nameInput.value='';
  toast('Saved “'+name+'”');
});
document.getElementById('projList').addEventListener('change',e=>{
  const name=e.target.value; if(!name) return;
  loadProject(readStore()[name]);
  document.getElementById('projName').value=name;
  toast('Loaded “'+name+'”');
});
document.getElementById('projDelete').addEventListener('click',()=>{
  const name=document.getElementById('projList').value;
  if(!name){ toast('Select a project to delete'); return; }
  if(!confirm('Delete project “'+name+'”?')) return;
  const store=readStore(); delete store[name]; writeStore(store);
  refreshProjectList(); document.getElementById('projName').value='';
  toast('Deleted “'+name+'”');
});
document.getElementById('projExport').addEventListener('click',()=>{
  const listed=document.getElementById('projList').value;
  const name=listed||document.getElementById('projName').value.trim()||document.getElementById('f_brandName').value.trim()||'project';
  const state=listed?readStore()[listed]:collectState();
  const payload={name,...state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.d7project.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Exported “'+name+'”');
});
document.querySelector('#projImport input').addEventListener('change',ev=>{
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const name=data.name||file.name.replace(/\.d7project\.json$|\.json$/,'')||'Imported project';
      const state={template:data.template,values:data.values||{}};
      const store=readStore(); store[name]=state; writeStore(store);
      refreshProjectList(name);
      loadProject(state);
      document.getElementById('projName').value=name;
      toast('Imported “'+name+'”');
    }catch(err){ toast('Could not read that file'); }
    ev.target.value='';
  };
  rd.readAsText(file);
});
refreshProjectList();
</script>
