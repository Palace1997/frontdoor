<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Opened from disk? Bounce to the running local server so fonts/assets load. */

  if (location.protocol === 'file:') {
    location.replace('http://localhost:4787/home-editorial.html' + location.hash);

})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrontDoor | Behavioral Health Websites</title>
<meta name="description" content="Calm, considered websites for behavioral health practices. Pick a design, we write it, build it and look after it for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300A583'/><text x='16' y='22' font-family='Inter,sans-serif' font-size='12' font-weight='700' fill='white' text-anchor='middle'>FD</text></svg>">
<style>
  :root{
    --forest:#0B362A; --forest-900:#072820; --green:#00A583;
    --canvas:#F7F4EE; --cream:#F0EBE1; --ink:#1B1812; --line:#E5E2DC;
    --font-display:'Fraunces',Georgia,serif;
    --font-sans:'Inter',system-ui,-apple-system,sans-serif;
    /* ---- Easy text/image swaps --------------------------------------
       Masthead word, eyebrow, wordmark and the hero image all live in the
       markup below; this page has no editor, so edit it here directly. */
    --frame:14px;              /* dark border around the rounded hero */
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font-sans);
    background:var(--forest-900);
    color:var(--cream);
    min-height:100vh;
    padding:var(--frame);
  }

  /* ---------- Rounded, full-bleed editorial hero ---------- */
  .ehero{
    position:relative;
    height:calc(100vh - var(--frame)*2);
    min-height:560px;
    border-radius:var(--radius);
    overflow:hidden;
    isolation:isolate;
    display:flex;
    flex-direction:column;
  }
  .ehero__bg{
    position:absolute; inset:0; z-index:0;
    /* Same hero photo as the live homepage (.lhero__bg in main.css) */
    background:
      url('https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=2400&q=80')
      center 46%/cover no-repeat;
    transform:scale(1.04);
  }
  /* Legibility + depth: warm wash top, soft darken bottom */
  .ehero__wash{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(7,40,32,.42) 0%, rgba(7,40,32,0) 22%),
      linear-gradient(to top, rgba(7,40,32,.55) 0%, rgba(7,40,32,0) 40%),
      radial-gradient(120% 80% at 50% 36%, rgba(247,244,238,.10), rgba(0,0,0,0) 60%);
  }

  /* ---------- Top bar: MENU · wordmark · SEARCH ---------- */
  .etop{
    position:relative; z-index:3;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:14px;
    padding:clamp(16px,2.4vw,30px) clamp(18px,3vw,40px);
  }
  .etop__side{display:flex; align-items:center; gap:18px}
  .etop__side--right{justify-content:flex-end}

  /* Right-side utility links (ported from the live homepage) */
  .elink{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cream); text-decoration:none; opacity:.92;
    transition:opacity .2s ease;
  }
  .elink:hover{opacity:1}
  .elink svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7}

  /* Centered logo */
  .ewordmark{display:block; line-height:0}
  .ewordmark img{height:clamp(44px,4.4vw,60px); width:auto; display:block}

  /* Nav pill (ported from the live homepage .lpill) */
  .lpill{
    display:flex; align-items:center; gap:2px;
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.6); border-radius:999px;
    padding:5px 6px 5px 20px; box-shadow:0 2px 14px rgba(31,42,29,.14);
  }
  .lpill{flex:0 0 auto}
  .lpill a{font-size:14px; font-weight:500; white-space:nowrap; color:#4b5b47; text-decoration:none; padding:8px 13px; border-radius:999px; transition:color .2s}
  .lpill a.cur{font-weight:600; color:#1f2a1d}
  .lpill a:hover{color:#1f2a1d}
  .lpill .lcta{background:#1f2a1d; color:#fff; padding:10px 20px; margin-left:6px; font-weight:500}
  .lpill .lcta:hover{color:#fff}

  /* ---------- Center stage: eyebrow + giant masthead ---------- */
  .estage{
    position:relative; z-index:2; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 18px;
    margin-top:-4vh;
  }
  .eeyebrow{
    font-size:clamp(11px,1.1vw,13px); font-weight:600;
    letter-spacing:.34em; text-transform:uppercase;
    color:var(--cream); opacity:.9;
    padding-left:.34em; margin-bottom:clamp(6px,1.2vw,14px);
  }
  .emast{
    font-family:var(--font-display); font-weight:500;
    font-size:clamp(68px,17vw,230px); line-height:.86;
    letter-spacing:-.02em; color:#F3ECDD;
    mix-blend-mode:soft-light;
    text-shadow:0 2px 40px rgba(0,0,0,.18);
    user-select:none;
  }
  /* A second, faint copy sits under the blended one so the word never
     disappears over the lightest part of the photo. */
  .emast-wrap{position:relative; display:inline-block}
  .emast-ghost{
    position:absolute; inset:0; z-index:-1;
    font-family:var(--font-display); font-weight:500;
    font-size:clamp(68px,17vw,230px); line-height:.86;
    letter-spacing:-.02em; color:rgba(243,236,221,.14);
  }

  /* ---------- Bottom: subline + round explore button ---------- */
  .efoot{
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:clamp(16px,2.4vw,26px);
    padding:0 clamp(18px,3vw,40px) clamp(26px,4vw,48px);
  }
  .esub{
    max-width:30ch; text-align:center;
    font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:clamp(15px,1.5vw,20px); line-height:1.5; color:var(--cream); opacity:.95;
  }
  .ecta{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--green); color:#04231b; text-decoration:none;
    font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    padding:14px 22px 14px 26px; border-radius:999px;
    transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
  }
  .ecta:hover{transform:translateY(-2px); box-shadow:0 16px 40px rgba(0,0,0,.34)}
  .ecta__dot{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; background:#04231b;
  }
  .ecta__dot svg{width:15px; height:15px; stroke:var(--green); fill:none; stroke-width:2}

  /* ---------- Mobile ---------- */
  /* Tablet: drop the utility-link labels to icons so the bar fits */
  @media (max-width:980px){
    .elink span.elabel{display:none}
  }
  /* Mobile: hide the wide pill + utility links, keep the logo centered */
  @media (max-width:640px){
    .etop{grid-template-columns:1fr auto 1fr}
    .lpill,.etop__side--right{display:none}
    .estage{margin-top:-2vh}
    .emast{mix-blend-mode:normal; color:rgba(243,236,221,.92)}
    .emast-ghost{display:none}
  }

  @media (prefers-reduced-motion:no-preference){
    .ehero__bg{animation:eZoom 18s ease-out forwards}
    @keyframes eZoom{from{transform:scale(1.12)} to{transform:scale(1.04)}}
    .eeyebrow,.emast-wrap,.esub,.ecta{animation:eRise .9s cubic-bezier(.2,.7,.2,1) both}
    .emast-wrap{animation-delay:.08s}
    .esub{animation-delay:.22s}
    .ecta{animation-delay:.3s}
    @keyframes eRise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)}}
  }
</style>
</head>
<body>
  <main class="ehero">
    <div class="ehero__bg" aria-hidden="true"></div>
    <div class="ehero__wash" aria-hidden="true"></div>

    <!-- Top bar: nav pill (left) · logo (center) · utility links (right) -->
    <header class="etop">
      <div class="etop__side">
        <nav class="lpill" aria-label="Main">
          <a class="cur" href="index.html#mission">Our Mission</a>
          <a href="index.html#how">How It Works</a>
          <a href="index.html#features">Package</a>
          <a href="index.html#faq">FAQ</a>
          <a class="lcta" href="index.html#start" data-book>Get Started</a>
        </nav>
      </div>
      <a class="ewordmark" href="index.html" aria-label="FrontDoor home">
        <img src="assets/img/logo-frontdoor-full-light.png?v=3" alt="FrontDoor, powered by iTrust Insights">
      </a>
      <div class="etop__side etop__side--right">
        <a class="elink" href="gallery.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          <span class="elabel">Browse Designs</span>
        </a>
        <a class="elink" href="index.html#start" data-book>
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20l1.2-4.2A8.4 8.4 0 1 1 21 11.5z"/></svg>
          <span class="elabel">Talk With Us</span>
        </a>
      </div>
    </header>

    <!-- Center stage -->
    <div class="estage">
      <p class="eeyebrow">Websites For Mental Health Practices</p>
      <div class="emast-wrap">
        <span class="emast-ghost" aria-hidden="true">SANCTUARY</span>
        <h1 class="emast">SANCTUARY</h1>
      </div>
    </div>

    <!-- Bottom -->
    <div class="efoot">
      <p class="esub">The first impression your practice deserves. Calm, clear, and quietly done for you.</p>
      <a class="ecta" href="gallery.html">
        Explore The Designs
        <span class="ecta__dot">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>
  </main>
</body>
</html>
